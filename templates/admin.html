<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nida's Salon - Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f8;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #8e3b5f;
        }

        table {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #8e3b5f;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #fff0f3;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 3px;
        }

        .edit-button {
            background-color: #5c7cfa;
        }

        .delete-button {
            background-color: #d9534f;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Nida's Salon - Admin Bookings</h1>
    <a href="/dashboard"
   style="display:block;
          width:200px;
          margin:20px auto;
          padding:12px;
          text-align:center;
          background-color:#8e3b5f;
          color:white;
          text-decoration:none;
          border-radius:5px;">
    Dashboard
</a>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Customer Name</th>
                <th>Service</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            {% for booking in bookings %}

            <tr>

                <td>{{ booking[0] }}</td>

                <td>{{ booking[1] }}</td>

                <td>{{ booking[2] }}</td>

                <td>{{ booking[3] }}</td>

                <td>{{ booking[4] }}</td>

                <td>

                    <form action="/status/{{ booking[0] }}" method="POST">

                        <select name="status" onchange="this.form.submit()">

                            <option value="Confirmed"
                                {% if booking[5] == "Confirmed" %}selected{% endif %}>
                                Confirmed
                            </option>

                            <option value="Completed"
                                {% if booking[5] == "Completed" %}selected{% endif %}>
                                Completed
                            </option>

                            <option value="Cancelled"
                                {% if booking[5] == "Cancelled" %}selected{% endif %}>
                                Cancelled
                            </option>

                        </select>

                    </form>

                </td>

                <td>

                    <a href="/edit/{{ booking[0] }}">
                        <button class="edit-button">Edit</button>
                    </a>

                    <a href="/delete/{{ booking[0] }}">
                        <button class="delete-button">Delete</button>
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
